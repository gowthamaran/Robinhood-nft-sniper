[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "robinhood-chain-nft-sniper"
version = "0.2.1"
description = "Security-first, VPS-native NFT mint automation for Robinhood Chain"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TheMaran" }]
dependencies = [
  "aiohttp>=3.10,<4",
  "cryptography>=43,<47",
  "eth-account>=0.13,<0.14",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "rich>=13.9,<15",
  "typer>=0.12,<1",
  "web3>=7.5,<8",
  "websockets>=13,<16",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "types-setuptools>=75",
]

[project.scripts]
robinhood-sniper = "sniper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["sniper"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires an Anvil-compatible local EVM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["tests"]
